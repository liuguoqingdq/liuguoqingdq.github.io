<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guoqing Liu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #1f2937;
    }

    .container {
      max-width: 820px;
      margin: 80px auto;
      padding: 0 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 48px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
      border: 1px solid #eceff3;
    }

    .tag {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: -0.8px;
      color: #111827;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 18px;
      color: #6b7280;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 32px 0;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .contact {
      font-size: 17px;
      line-height: 1.8;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 28px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 30px auto;
      }

      .card {
        padding: 30px 24px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <div class="tag">Researcher</div>

      <h1>Guoqing Liu</h1>

      <div class="subtitle">
        Research interests in efficient AI systems and large language models.
      </div>

      <div class="divider"></div>

      <div class="section-title">Contact</div>

      <div class="contact">
        Email:
        <a href="mailto:18246154169@163.com">
          18246154169@163.com
        </a>
      </div>

      <div class="footer">
        Personal academic homepage
      </div>

    </div>
  </div>
</body>
</html>
